name: Pac-Land MD ROM Maker

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rom-maker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            filename: PacLand-ROM-Maker-Windows-x64.exe
          - platform: linux-x64
            runner: ubuntu-22.04
            filename: PacLand-ROM-Maker-Linux-x64.AppImage
          - platform: macos-arm64
            runner: macos-15
            filename: PacLand-ROM-Maker-macOS-Apple-Silicon.dmg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/rom-maker/app/requirements.txt

      - name: Verify native architecture
        shell: python
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          import os
          import platform
          import sys
          target = os.environ['BUILD_PLATFORM']
          machine = platform.machine().lower()
          print(sys.platform, machine)
          expected = ('arm64', 'aarch64') if target == 'macos-arm64' else ('amd64', 'x86_64')
          if machine not in expected:
              raise SystemExit('Runner architecture does not match the requested package')

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libnss3

      - name: Install application packaging dependencies
        run: python -m pip install -r tools/rom-maker/app/requirements.txt

      - name: Cache verified runtime downloads
        uses: actions/cache@v4
        with:
          path: build/portable-cache
          key: rom-maker-${{ matrix.platform }}-${{ hashFiles('tools/rom-maker/portable-runtimes.json', 'package-lock.json') }}

      - name: Run ROM-independent tests
        run: python -m unittest discover -s tools/rom-maker -p "test_*.py"

      - name: Build application and bundle tools
        run: python tools/rom-maker/app/package.py --platform ${{ matrix.platform }}

      - name: Test Windows application and bundled compilers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'self-test.json'
          $exe = Join-Path $PWD 'dist/desktop/PacLand-ROM-Maker.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--report', "`"$report`"") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Application self-test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Application did not produce a self-test report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          Get-Content $report
          if (-not $result.ok) { throw 'Bundled toolchain self-test failed' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $exe 'release-assets/${{ matrix.filename }}'

      - name: Build and test Linux AppImage
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl -fL --retry 3 -o build/desktop/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fL --retry 3 -o build/desktop/appimage-runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  build/desktop/appimagetool' | sha256sum -c -
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  build/desktop/appimage-runtime' | sha256sum -c -
          chmod +x build/desktop/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 build/desktop/appimagetool --no-appstream --runtime-file build/desktop/appimage-runtime build/desktop/AppDir release-assets/${{ matrix.filename }}
          chmod +x release-assets/${{ matrix.filename }}
          APPIMAGE_EXTRACT_AND_RUN=1 release-assets/${{ matrix.filename }} --self-test --report "$RUNNER_TEMP/self-test.json"
          cat "$RUNNER_TEMP/self-test.json"
          python -c "import json,os; assert json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'self-test.json')))['ok']"

      - name: Test Apple Silicon application and bundled compilers
        if: runner.os == 'macOS'
        run: |
          dist/desktop/PacLand-ROM-Maker.app/Contents/MacOS/PacLand-ROM-Maker --self-test --report "$RUNNER_TEMP/self-test.json"
          cat "$RUNNER_TEMP/self-test.json"
          python -c "import json,os; assert json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'self-test.json')))['ok']"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p build/desktop/dmg-root release-assets
          cp -R dist/desktop/PacLand-ROM-Maker.app build/desktop/dmg-root/
          hdiutil create -volname "Pac-Land MD ROM Maker" -srcfolder build/desktop/dmg-root -ov -format UDZO release-assets/${{ matrix.filename }}

      - name: Test application from read-only DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          MOUNT_PATH="$RUNNER_TEMP/pacland-dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_PATH" release-assets/${{ matrix.filename }}
          trap 'hdiutil detach "$MOUNT_PATH"' EXIT
          "$MOUNT_PATH/PacLand-ROM-Maker.app/Contents/MacOS/PacLand-ROM-Maker" --self-test --report "$RUNNER_TEMP/mounted-self-test.json"
          cat "$RUNNER_TEMP/mounted-self-test.json"
          python -c "import json,os; assert json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'mounted-self-test.json')))['ok']"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/self-test.json
            ${{ runner.temp }}/mounted-self-test.json
          if-no-files-found: ignore

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: release-assets/${{ matrix.filename }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create or update pre-release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download application packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Verify packages and generate checksums
        run: |
          set -euo pipefail
          test -s release-assets/PacLand-ROM-Maker-Windows-x64.exe
          test -s release-assets/PacLand-ROM-Maker-Linux-x64.AppImage
          test -s release-assets/PacLand-ROM-Maker-macOS-Apple-Silicon.dmg
          cd release-assets
          sha256sum *.exe *.AppImage *.dmg > SHA256SUMS.txt

      - name: Update pre-release tag
        run: |
          git tag -f Pre-release "$GITHUB_SHA"
          git push -f origin refs/tags/Pre-release

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: Pre-release
          name: Pac-Land MD ROM Maker Pre-release
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          body: |
            Portable ROM Maker for Windows x64, Linux x64 and Apple Silicon.
            Download the executable, AppImage or DMG directly. No installer or first-run dependency downloads.
            Supply your own supported Pac-Land arcade ROMs. No game ROM or generated game assets are included.
