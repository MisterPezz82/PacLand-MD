name: Pac-Land MD ROM Maker
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tools/rom-maker/app/requirements.txt
    - name: Verify native architecture
      shell: python
      env:
        BUILD_PLATFORM: windows-x64
      run: |
        import os
        import platform
        import sys
        target = os.environ['BUILD_PLATFORM']
        machine = platform.machine().lower()
        print(sys.platform, machine)
        expected = ('arm64', 'aarch64') if target == 'macos-arm64' else ('amd64', 'x86_64')
        if machine not in expected:
            raise SystemExit('Runner architecture does not match the requested package')
    - name: Install application packaging dependencies
      run: python -m pip install -r tools/rom-maker/app/requirements.txt
    - name: Cache verified runtime downloads
      uses: actions/cache@v4
      with:
        path: build/portable-cache
        key: rom-maker-windows-x64-${{ hashFiles('tools/rom-maker/portable-runtimes.json', 'package-lock.json') }}
    - name: Build application and bundle tools
      run: python tools/rom-maker/app/package.py --platform windows-x64
    - name: Package Windows executable
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force release-assets | Out-Null
        Copy-Item 'dist/desktop/PacLand-ROM-Maker.exe' 'release-assets/PacLand-ROM-Maker-Windows-x64.exe'
    - name: Upload application
      uses: actions/upload-artifact@v4
      with:
        name: package-windows-x64
        path: release-assets/PacLand-ROM-Maker-Windows-x64.exe
        if-no-files-found: error
        compression-level: 0
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tools/rom-maker/app/requirements.txt
    - name: Verify native architecture
      shell: python
      env:
        BUILD_PLATFORM: linux-x64
      run: |
        import os
        import platform
        import sys
        target = os.environ['BUILD_PLATFORM']
        machine = platform.machine().lower()
        print(sys.platform, machine)
        expected = ('arm64', 'aarch64') if target == 'macos-arm64' else ('amd64', 'x86_64')
        if machine not in expected:
            raise SystemExit('Runner architecture does not match the requested package')
    - name: Install Linux desktop libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libnss3
    - name: Install application packaging dependencies
      run: python -m pip install -r tools/rom-maker/app/requirements.txt
    - name: Cache verified runtime downloads
      uses: actions/cache@v4
      with:
        path: build/portable-cache
        key: rom-maker-linux-x64-${{ hashFiles('tools/rom-maker/portable-runtimes.json', 'package-lock.json') }}
    - name: Build application and bundle tools
      run: python tools/rom-maker/app/package.py --platform linux-x64
    - name: Build Linux AppImage
      run: |
        set -euo pipefail
        mkdir -p release-assets
        curl -fL --retry 3 -o build/desktop/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        curl -fL --retry 3 -o build/desktop/appimage-runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
        echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  build/desktop/appimagetool' | sha256sum -c -
        echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  build/desktop/appimage-runtime' | sha256sum -c -
        chmod +x build/desktop/appimagetool
        APPIMAGE_EXTRACT_AND_RUN=1 build/desktop/appimagetool --no-appstream --runtime-file build/desktop/appimage-runtime build/desktop/AppDir release-assets/PacLand-ROM-Maker-Linux-x64.AppImage
        chmod +x release-assets/PacLand-ROM-Maker-Linux-x64.AppImage
    - name: Upload application
      uses: actions/upload-artifact@v4
      with:
        name: package-linux-x64
        path: release-assets/PacLand-ROM-Maker-Linux-x64.AppImage
        if-no-files-found: error
        compression-level: 0
  build-macos:
    name: Build macOS Apple Silicon
    runs-on: macos-26
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tools/rom-maker/app/requirements.txt
    - name: Verify native architecture
      shell: python
      env:
        BUILD_PLATFORM: macos-arm64
      run: |
        import os
        import platform
        import sys
        target = os.environ['BUILD_PLATFORM']
        machine = platform.machine().lower()
        print(sys.platform, machine)
        expected = ('arm64', 'aarch64') if target == 'macos-arm64' else ('amd64', 'x86_64')
        if machine not in expected:
            raise SystemExit('Runner architecture does not match the requested package')
    - name: Install application packaging dependencies
      run: python -m pip install -r tools/rom-maker/app/requirements.txt
    - name: Cache verified runtime downloads
      uses: actions/cache@v4
      with:
        path: build/portable-cache
        key: rom-maker-macos-arm64-${{ hashFiles('tools/rom-maker/portable-runtimes.json', 'package-lock.json') }}
    - name: Build application and bundle tools
      run: python tools/rom-maker/app/package.py --platform macos-arm64
    - name: Create macOS DMG
      run: |
        set -euo pipefail
        mkdir -p build/desktop/dmg-root release-assets
        cp -R dist/desktop/PacLand-ROM-Maker.app build/desktop/dmg-root/
        hdiutil create -volname "Pac-Land MD ROM Maker" -srcfolder build/desktop/dmg-root -ov -format UDZO release-assets/PacLand-ROM-Maker-macOS-Apple-Silicon.dmg
    - name: Upload application
      uses: actions/upload-artifact@v4
      with:
        name: package-macos-arm64
        path: release-assets/PacLand-ROM-Maker-macOS-Apple-Silicon.dmg
        if-no-files-found: error
        compression-level: 0
  release:
    name: Create or update pre-release
    runs-on: ubuntu-latest
    needs:
    - build-windows
    - build-linux
    - build-macos
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Download application packages
      uses: actions/download-artifact@v4
      with:
        pattern: package-*
        path: release-assets
        merge-multiple: true
    - name: Verify packages and generate checksums
      run: |
        set -euo pipefail
        test -s release-assets/PacLand-ROM-Maker-Windows-x64.exe
        test -s release-assets/PacLand-ROM-Maker-Linux-x64.AppImage
        test -s release-assets/PacLand-ROM-Maker-macOS-Apple-Silicon.dmg
        cd release-assets
        sha256sum *.exe *.AppImage *.dmg > SHA256SUMS.txt
    - name: Update pre-release tag
      run: |
        git tag -f Pre-release "$GITHUB_SHA"
        git push -f origin refs/tags/Pre-release
    - name: Create or update release
      uses: ncipollo/release-action@v1
      with:
        tag: Pre-release
        name: Pac-Land MD ROM Maker Pre-release
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        artifacts: release-assets/*
        artifactErrorsFailBuild: true
        body: |
          Portable ROM Maker for Windows x64, Linux x64 and Apple Silicon.
          Download the executable, AppImage or DMG directly. No installer or first-run dependency downloads.
          Supply your own supported Pac-Land arcade ROMs. No game ROM or generated game assets are included.
